name: CI

on:
  push:
    branches: [main, claude/theme-panel-lite-apps-jcwkn8]  # TEMP: CI on the work branch while testing
  pull_request:
  # Run by hand (for example on a branch), with a longer idle check if wanted.
  workflow_dispatch:
    inputs:
      idle_seconds:
        description: "Theme stress test: how long to leave the window idle (seconds)"
        default: "60"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size
        shell: bash
        run: |
          f=target/release/brightness-lite; [ -f "$f.exe" ] && f="$f.exe"
          size=$(wc -c < "$f")
          echo "$f: $size bytes"
          echo "### Binary size: $size bytes (\`$f\`)" >> "$GITHUB_STEP_SUMMARY"
      # Memory check: open and hide the window 300 times and print PrivateUsage and
      # WorkingSetSize at 0, 75, 150 and 300 cycles and 3 s after the last hide.
      # Fails if the 300 cycles do not finish.
      - name: Cycle test (window open/hide x300, memory)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          summary() { { echo "### Cycle test, $1"; echo '```'; cat "$2"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
          ./target/release/brightness-lite.exe --cycle-test 300 || echo "exit code $?"
          touch cycle-test.log && cat cycle-test.log && summary "Windows OpenGL" cycle-test.log
          # The runner has no GPU. If no window could be made, try Mesa's software OpenGL.
          if ! grep -q "cycle 300" cycle-test.log; then
            curl -sSfL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.2.5/mesa3d-24.2.5-release-msvc.7z
            mkdir -p mesa && 7z e -y -omesa mesa.7z 'x64/*.dll' > /dev/null
            cp target/release/brightness-lite.exe mesa/
            cd mesa
            GALLIUM_DRIVER=llvmpipe ./brightness-lite.exe --cycle-test 300 || echo "exit code $?"
            touch cycle-test.log && cat cycle-test.log && summary "Mesa llvmpipe (software OpenGL)" cycle-test.log
          fi
          grep -q "+3 s idle" cycle-test.log || { echo "cycle test did not finish"; exit 1; }
      # Theme panel stress test, in the real window: open/close the panel 2000
      # times (moving the window to the screen edges, then 60 fast clicks),
      # switch the appearance 2000 times and the colour 2000 times (clicks go
      # through egui's input), show/hide the window 500 times (theme.json
      # changed by "the other app" every 10th time), then leave it idle.
      # Prints private bytes, working set, handles, GDI and USER objects at
      # the start, middle and end of each step, and the idle CPU. Fails if any
      # of them kept growing, the window left the work area or a click did not
      # do what it should.
      - name: Theme stress test (panel x2000, appearance x2000, colour x2000, show/hide x500, idle)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        shell: bash
        run: |
          if [ -f mesa/brightness-lite.exe ]; then cd mesa; exe=./brightness-lite.exe; else exe=./target/release/brightness-lite.exe; fi
          rm -f cycle-test.log
          "$exe" --theme-test 2000 "${{ github.event.inputs.idle_seconds || '60' }}" || echo "exit code $?"
          touch cycle-test.log && cat cycle-test.log
          { echo "### Theme stress test"; echo '```'; cat cycle-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "theme-test: PASS" cycle-test.log || { echo "theme stress test failed"; exit 1; }
