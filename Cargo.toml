[package]
name = "brightness-lite"
version = "0.1.0"
edition = "2021"
description = "Windows tray app for external monitor brightness and contrast over DDC/CI"
license = "MIT"
repository = "https://github.com/ShelaShelby/brightness-lite"

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "=0.26.1", default-features = false }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
