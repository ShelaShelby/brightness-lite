[package]
name = "brightness-lite"
version = "0.2.1"
edition = "2021"
description = "Tray app for external monitor brightness and contrast over DDC/CI (Windows and Linux)"
license = "MIT"
repository = "https://github.com/ShelaShelby/brightness-lite"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "=0.26.1", default-features = false }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
global-hotkey = { version = "=0.8.0", default-features = false }
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
